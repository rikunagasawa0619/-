<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    background: #f8f9fa;
    padding: 12px;
  }

  /* === 検索バー === */
  .search-wrap {
    position: sticky;
    top: 0;
    background: #f8f9fa;
    padding-bottom: 8px;
    z-index: 10;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-input:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.15);
  }

  /* === カテゴリチップ === */
  .cat-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .cat-chip {
    padding: 8px 14px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .cat-chip:hover {
    background: #e8f0fe;
    border-color: #1a73e8;
  }
  .cat-chip.active {
    background: #1a73e8;
    color: #fff;
    border-color: #1a73e8;
  }

  /* === 戻るボタン === */
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    margin-bottom: 8px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 13px;
    color: #5f6368;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-back:hover {
    background: #e8f0fe;
    color: #1a73e8;
    border-color: #1a73e8;
  }

  /* === 件数 === */
  .count {
    font-size: 11px;
    color: #5f6368;
    margin: 4px 0 8px;
  }

  /* === Gender ボタン === */
  .gender-card {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 10px;
    padding: 18px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
    color: #1a73e8;
    transition: box-shadow .15s;
  }
  .gender-card:hover { box-shadow: 0 1px 6px rgba(0,0,0,.1); }
  .gender-card .sub {
    font-size: 12px;
    font-weight: 400;
    color: #5f6368;
    margin-top: 4px;
  }

  /* === 商品カード（サイズボタン付き） === */
  .product-card {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .product-card .card-title {
    font-weight: 600;
    font-size: 14px;
    color: #1a73e8;
    margin-bottom: 10px;
  }

  /* 個数 + サイズボタン行 */
  .card-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .qty-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .qty-label {
    font-size: 12px;
    color: #5f6368;
    font-weight: 500;
  }
  .qty-input {
    width: 44px;
    padding: 8px 4px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
    outline: none;
  }
  .qty-input:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.15);
  }

  /* サイズボタン */
  .size-wrap {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .size-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 50px;
    padding: 8px 6px 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .15s;
    color: #fff;
    flex: 1;
  }
  .size-btn:hover:not(:disabled) { opacity: 0.8; }
  .size-btn .size-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
  }
  .size-btn .size-stock {
    font-size: 9px;
    font-weight: 400;
    line-height: 1.2;
    margin-top: 2px;
    opacity: 0.9;
  }
  .size-btn.stock-ok {
    background: #1a73e8;
  }
  .size-btn.stock-low {
    background: #c5221f;
  }
  .size-btn.stock-zero {
    background: #dadce0;
    color: #80868b;
    cursor: default;
  }

  /* === トースト === */
  .toast {
    position: fixed;
    bottom: 16px;
    left: 12px;
    right: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.success { background: #137333; }
  .toast.error   { background: #c5221f; }

  /* === ローディング === */
  .loading {
    text-align: center;
    padding: 40px 0;
    color: #5f6368;
  }
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #dadce0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 検索 -->
<div class="search-wrap">
  <input type="text" class="search-input" id="search"
         placeholder="商品コード / 商品名 で検索…">
</div>

<!-- カテゴリチップ -->
<div class="cat-wrap" id="catWrap"></div>

<!-- ナビゲーション -->
<div id="nav"></div>

<!-- 件数 -->
<div class="count" id="count"></div>

<!-- コンテンツ -->
<div id="content">
  <div class="loading"><div class="spinner"></div><p style="margin-top:8px">商品を読み込み中…</p></div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
  /* ===== データ ===== */
  var products = [];
  var selectedCategory = null;
  var selectedGender = null;

  /* ===== カテゴリ表示順 ===== */
  var CATEGORY_ORDER = ['トップス', 'ボトムス', 'アーム系', 'ソックス系', 'その他'];
  var GENDER_CATEGORIES = ['トップス', 'ボトムス'];

  /* ===== 初期化 ===== */
  document.addEventListener('DOMContentLoaded', function() {
    google.script.run
      .withSuccessHandler(onProductsLoaded)
      .withFailureHandler(onLoadError)
      .getProductList();
  });

  function onProductsLoaded(data) {
    products = data || [];
    showCategories();
  }

  function onLoadError(err) {
    document.getElementById('content').innerHTML =
      '<p style="color:#c5221f;padding:16px">読み込みに失敗しました: ' + escapeHtml(err.message) + '</p>';
  }

  /* ===== 検索 ===== */
  document.getElementById('search').addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    if (!q) {
      if (selectedGender) {
        showProducts();
      } else if (selectedCategory) {
        if (GENDER_CATEGORIES.indexOf(selectedCategory) !== -1) {
          showGenders();
        } else {
          showProducts();
        }
      } else {
        showCategories();
      }
      return;
    }
    var results = products.filter(function(p) {
      return p.code.toLowerCase().indexOf(q) !== -1 ||
             p.name.toLowerCase().indexOf(q) !== -1;
    });
    showSearchResults(results);
  });

  /* ===== カテゴリ一覧 ===== */
  function showCategories() {
    selectedCategory = null;
    selectedGender = null;

    var catCounts = {};
    for (var i = 0; i < products.length; i++) {
      var cat = products[i].category || 'その他';
      catCounts[cat] = (catCounts[cat] || 0) + 1;
    }

    var orderedCats = [];
    for (var i = 0; i < CATEGORY_ORDER.length; i++) {
      if (catCounts[CATEGORY_ORDER[i]]) orderedCats.push(CATEGORY_ORDER[i]);
    }
    for (var cat in catCounts) {
      if (orderedCats.indexOf(cat) === -1) orderedCats.push(cat);
    }

    var catWrap = document.getElementById('catWrap');
    var html = '';
    for (var i = 0; i < orderedCats.length; i++) {
      var cat = orderedCats[i];
      html += '<div class="cat-chip" onclick="onCategoryClick(\'' + escapeJs(cat) + '\')">'
            + escapeHtml(cat) + ' (' + catCounts[cat] + ')</div>';
    }
    catWrap.innerHTML = html;

    document.getElementById('nav').innerHTML = '';
    document.getElementById('count').textContent = '全 ' + products.length + ' 件';
    document.getElementById('content').innerHTML =
      '<p style="color:#5f6368;text-align:center;padding:24px 0">'
      + 'カテゴリを選択するか、<br>検索バーで商品を検索してください</p>';
  }

  /* ===== カテゴリ選択 ===== */
  function onCategoryClick(cat) {
    selectedCategory = cat;
    selectedGender = null;
    document.getElementById('search').value = '';

    if (GENDER_CATEGORIES.indexOf(cat) !== -1) {
      showGenders();
    } else {
      showProducts();
    }
  }

  /* ===== Men's / Women's 選択 ===== */
  function showGenders() {
    selectedGender = null;
    updateCatChips();

    document.getElementById('nav').innerHTML =
      '<button class="btn-back" onclick="showCategories()">\u2190 カテゴリ一覧</button>';

    var genderCounts = {};
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      if ((p.category || 'その他') !== selectedCategory) continue;
      var g = p.gender || '未設定';
      genderCounts[g] = (genderCounts[g] || 0) + 1;
    }

    document.getElementById('count').textContent = escapeHtml(selectedCategory);

    var html = '';
    for (var g in genderCounts) {
      html += '<div class="gender-card" onclick="onGenderClick(\'' + escapeJs(g) + '\')">'
            + escapeHtml(g)
            + '<div class="sub">' + genderCounts[g] + ' 件</div></div>';
    }
    document.getElementById('content').innerHTML = html;
  }

  function onGenderClick(gender) {
    selectedGender = gender;
    document.getElementById('search').value = '';
    showProducts();
  }

  /* ===== 商品一覧（サイズボタン付きカード） ===== */
  function showProducts() {
    updateCatChips();

    var hasGender = GENDER_CATEGORIES.indexOf(selectedCategory) !== -1;
    if (hasGender && selectedGender) {
      document.getElementById('nav').innerHTML =
        '<button class="btn-back" onclick="showGenders()">\u2190 ' + escapeHtml(selectedCategory) + '</button>';
    } else {
      document.getElementById('nav').innerHTML =
        '<button class="btn-back" onclick="showCategories()">\u2190 カテゴリ一覧</button>';
    }

    var filtered = [];
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      if ((p.category || 'その他') !== selectedCategory) continue;
      if (hasGender && selectedGender && (p.gender || '未設定') !== selectedGender) continue;
      filtered.push(p);
    }

    var grouped = groupByName(filtered);

    var title = selectedCategory;
    if (hasGender && selectedGender) title += ' / ' + selectedGender;
    document.getElementById('count').textContent = escapeHtml(title) + ': ' + grouped.order.length + ' 商品';

    var showSeries = hasGender;
    var html = '';
    for (var i = 0; i < grouped.order.length; i++) {
      html += buildProductCard(grouped.groups[grouped.order[i]], showSeries);
    }

    if (grouped.order.length === 0) {
      html = '<p style="color:#5f6368;text-align:center;padding:16px">このカテゴリに商品がありません</p>';
    }
    document.getElementById('content').innerHTML = html;
  }

  /* ===== 検索結果 ===== */
  function showSearchResults(results) {
    var chips = document.querySelectorAll('.cat-chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');

    document.getElementById('nav').innerHTML = '';
    document.getElementById('count').textContent =
      results.length + ' 件表示（全 ' + products.length + ' 件）';

    if (results.length === 0) {
      document.getElementById('content').innerHTML =
        '<p style="color:#5f6368;padding:16px;text-align:center">該当する商品がありません</p>';
      return;
    }

    var grouped = groupByName(results);
    var html = '';
    for (var i = 0; i < grouped.order.length; i++) {
      var items = grouped.groups[grouped.order[i]];
      var isGenderCat = GENDER_CATEGORIES.indexOf(items[0].category) !== -1;
      html += buildProductCard(items, isGenderCat);
    }
    document.getElementById('content').innerHTML = html;
  }

  /* ===== 商品をname でグループ化 ===== */
  function groupByName(items) {
    var groups = {};
    var order = [];
    for (var i = 0; i < items.length; i++) {
      var key = items[i].name;
      if (!groups[key]) {
        groups[key] = [];
        order.push(key);
      }
      groups[key].push(items[i]);
    }
    return { groups: groups, order: order };
  }

  /* ===== 商品カード生成（サイズボタン付き） ===== */
  function buildProductCard(items, showSeries) {
    var name = items[0].name;
    var series = items[0].series;
    var groupId = items[0].code;

    var html = '<div class="product-card">';

    // タイトル: トップス/ボトムスは「シリーズ｜商品名」、それ以外は「商品名」
    if (showSeries && series) {
      html += '<div class="card-title">' + escapeHtml(series) + '\uff5c' + escapeHtml(name) + '</div>';
    } else {
      html += '<div class="card-title">' + escapeHtml(name) + '</div>';
    }

    // 個数 + サイズボタン
    html += '<div class="card-row">';
    html += '<div class="qty-group">';
    html += '<span class="qty-label">個数</span>';
    html += '<input type="number" class="qty-input" id="qty-' + escapeHtml(groupId) + '" value="1" min="1">';
    html += '</div>';

    html += '<div class="size-wrap">';
    for (var j = 0; j < items.length; j++) {
      var p = items[j];
      var btnClass = p.stock <= 0 ? 'stock-zero' : (p.stock < 4 ? 'stock-low' : 'stock-ok');
      var sizeLabel = p.size || '登録';

      html += '<button class="size-btn ' + btnClass + '" id="btn-' + escapeHtml(p.code) + '" '
            + 'data-size="' + escapeHtml(sizeLabel) + '" '
            + 'onclick="doSaleGroup(\'' + escapeJs(p.code) + '\',\'' + escapeJs(groupId) + '\')"'
            + (p.stock <= 0 ? ' disabled' : '') + '>';
      html += '<span class="size-name">' + escapeHtml(sizeLabel) + '</span>';
      html += '<span class="size-stock">' + (p.stock <= 0 ? '---' : '残' + p.stock) + '</span>';
      html += '</button>';
    }
    html += '</div>'; // size-wrap

    html += '</div>'; // card-row
    html += '</div>'; // product-card
    return html;
  }

  /* ===== カテゴリチップ更新 ===== */
  function updateCatChips() {
    var catCounts = {};
    for (var i = 0; i < products.length; i++) {
      var cat = products[i].category || 'その他';
      catCounts[cat] = (catCounts[cat] || 0) + 1;
    }
    var orderedCats = [];
    for (var i = 0; i < CATEGORY_ORDER.length; i++) {
      if (catCounts[CATEGORY_ORDER[i]]) orderedCats.push(CATEGORY_ORDER[i]);
    }
    for (var cat in catCounts) {
      if (orderedCats.indexOf(cat) === -1) orderedCats.push(cat);
    }

    var catWrap = document.getElementById('catWrap');
    var html = '';
    for (var i = 0; i < orderedCats.length; i++) {
      var cat = orderedCats[i];
      var active = selectedCategory === cat ? ' active' : '';
      html += '<div class="cat-chip' + active + '" onclick="onCategoryClick(\'' + escapeJs(cat) + '\')">'
            + escapeHtml(cat) + '</div>';
    }
    catWrap.innerHTML = html;
  }

  /* ===== 売上登録（サイズボタンから） ===== */
  function doSaleGroup(code, groupId) {
    var btn = document.getElementById('btn-' + code);
    var qtyInput = document.getElementById('qty-' + groupId);
    var qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
    var sizeName = btn.getAttribute('data-size');

    btn.disabled = true;
    btn.innerHTML = '<span class="size-name">' + escapeHtml(sizeName) + '</span>'
                  + '<span class="size-stock">\u2026</span>';

    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          showToast(result.message, 'success');
          updateStock(code, result.newStock);
        } else {
          showToast(result.message, 'error');
          refreshButton(code);
        }
      })
      .withFailureHandler(function(err) {
        showToast('エラー: ' + err.message, 'error');
        refreshButton(code);
      })
      .recordSaleByCode(code, qty);
  }

  /* ===== 在庫更新 ===== */
  function updateStock(code, newStock) {
    for (var i = 0; i < products.length; i++) {
      if (products[i].code === code) {
        products[i].stock = newStock;
        break;
      }
    }
    refreshButton(code);
  }

  function refreshButton(code) {
    var btn = document.getElementById('btn-' + code);
    if (!btn) return;

    var stock = 0;
    var sizeName = btn.getAttribute('data-size') || '';
    for (var i = 0; i < products.length; i++) {
      if (products[i].code === code) {
        stock = products[i].stock;
        break;
      }
    }

    if (stock <= 0) {
      btn.className = 'size-btn stock-zero';
      btn.disabled = true;
    } else {
      btn.className = 'size-btn ' + (stock < 4 ? 'stock-low' : 'stock-ok');
      btn.disabled = false;
    }
    btn.innerHTML = '<span class="size-name">' + escapeHtml(sizeName) + '</span>'
                  + '<span class="size-stock">' + (stock <= 0 ? '---' : '残' + stock) + '</span>';
  }

  /* ===== トースト ===== */
  function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    setTimeout(function() { toast.className = 'toast'; }, 3000);
  }

  /* ===== ユーティリティ ===== */
  function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }
  function escapeJs(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }
</script>
</body>
</html>
